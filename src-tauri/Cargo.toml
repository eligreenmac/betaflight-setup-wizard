[package]
name = "betaflight-setup-wizard"
version = "0.1.0"
description = "Offline-first Betaflight setup wizard for Windows"
authors = ["Betaflight Setup Wizard contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/eligreenmac/betaflight-setup-wizard"
edition = "2021"
rust-version = "1.90"

[lib]
name = "bfsw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-opener = "2"
# device: serial ports (COM enumeration with USB VID/PID, 115200 8N1 I/O)
serialport = "4"
# device: debug logging of MSP/CLI traffic (already in the tree via tauri)
log = "0.4"

# Workstream-specific dependencies are added by their owners, e.g.:
#   device:  serialport
#   flasher: rusb (or bundled dfu-util), reqwest, sha2
#   config:  (pure Rust, no I/O deps expected)
