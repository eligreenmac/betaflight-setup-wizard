[package]
name = "betaflight-setup-wizard"
version = "0.1.0-4"
description = "Offline-first Betaflight setup wizard for Windows"
authors = ["Betaflight Setup Wizard contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/eligreenmac/betaflight-setup-wizard"
edition = "2021"
rust-version = "1.90"

[lib]
name = "bfsw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-opener = "2"
# device: serial ports (COM enumeration with USB VID/PID, 115200 8N1 I/O)
serialport = "4"
# device: debug logging of MSP/CLI traffic (already in the tree via tauri)
log = "0.4"
# flasher
rusb = { version = "0.9", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

# Workstream-specific dependencies are added by their owners, e.g.:
#   device:  serialport
#   flasher: rusb (or bundled dfu-util), reqwest, sha2
#   config:  (pure Rust, no I/O deps expected)

# packaging (system/): SetupAPI device/driver enumeration and ShellExecuteExW
# "runas" to start the elevated WinUSB helper. Windows-only; already in the
# lockfile via tauri/tao, so this adds no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
