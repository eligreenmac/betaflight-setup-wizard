name: build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo and upload artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action versions: every JavaScript action here runs on Node 24 (checkout@v7,
# setup-node@v7, upload-artifact@v7, Swatinem/rust-cache@v2 >= 2.8; the local
# build-wdi-simple action uses actions/cache@v6 and microsoft/setup-msbuild@v3).
# dtolnay/rust-toolchain is a composite action (no Node runtime).
# Note: `node-version: 22` below is the app's build toolchain, not the action runtime.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build WinUSB helper (libwdi, cached)
        uses: ./.github/actions/build-wdi-simple
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: tauri build (NSIS + MSI)
        run: npm run tauri build
      - name: Check WinUSB helper is inside the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $list = 7z l $setup.FullName
          if (-not ($list | Select-String -SimpleMatch 'bfsw-wdi-simple.exe')) { throw "bfsw-wdi-simple.exe not found in $($setup.Name)" }
          $list | Select-String -SimpleMatch 'drivers'
      - name: Elevated WinUSB install mode of the built app exe
        # Runs the real release exe the way the app relaunches itself via UAC
        # (runners are already elevated): main() must dispatch before Tauri starts,
        # find drivers/bfsw-wdi-simple.exe next to the exe, create/verify/clean the
        # admin-only %ProgramData% folder (no devices -> exit 0) and reject bad args.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path src-tauri/target/release/betaflight-setup-wizard.exe
          function Invoke-Mode([string[]]$a) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -WindowStyle Hidden
            $p.ExitCode
          }
          $code = Invoke-Mode @('--bfsw-elevated-winusb-install')
          if ($code -ne 0) { throw "no-device run exited $code (expected 0)" }
          $code = Invoke-Mode @('--bfsw-elevated-winusb-install', 'not-a-device')
          if ($code -ne 1008) { throw "bad-args run exited $code (expected 1008)" }
          $left = @(Get-ChildItem -Force -Directory $env:ProgramData -Filter 'BFSW-WinUSB-*')
          if ($left.Count -ne 0) { throw "work folder left behind: $($left.Name -join ', ')" }
          Write-Host 'elevated mode OK'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev libusb-1.0-0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: cargo fmt / check / test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
