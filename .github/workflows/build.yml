name: build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apt_fallback_test:
        description: "Linux only: make apt attempt 1 use an unreachable mirror to exercise the fallback"
        type: boolean
        default: false

# Least privilege: CI only needs to read the repo and upload artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action versions: every JavaScript action here runs on Node 24 (checkout@v7,
# setup-node@v7, upload-artifact@v7, Swatinem/rust-cache@v2 >= 2.8; the local
# build-wdi-simple action uses actions/cache@v6 and microsoft/setup-msbuild@v3).
# dtolnay/rust-toolchain is a composite action (no Node runtime).
# Note: `node-version: 22` below is the app's build toolchain, not the action runtime.
jobs:
  windows:
    if: ${{ !inputs.apt_fallback_test }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build WinUSB helper (libwdi, cached)
        uses: ./.github/actions/build-wdi-simple
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Check app version
        id: version
        run: node .github/scripts/check-release-version.mjs
      - name: NSIS template is Tauri's + the version change
        run: node src-tauri/windows/nsis-template.mjs --check
      - name: tauri build (NSIS + MSI)
        run: npm run tauri build
      # VERSIONINFO numbers must follow the app version like the MSI (X.Y.Z-N -> X.Y.Z.N):
      # the NSIS template sets the installer's, beforeBundleCommand patches the app exe.
      - name: Check numeric Windows versions (setup.exe, app exe)
        shell: pwsh
        run: >-
          ./.github/scripts/check-windows-versions.ps1 -Expected '${{ steps.version.outputs.windows_version }}'
          -Path (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName,
          src-tauri/target/release/betaflight-setup-wizard.exe
      - name: Check WinUSB helper is inside the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $list = 7z l $setup.FullName
          if (-not ($list | Select-String -SimpleMatch 'bfsw-wdi-simple.exe')) { throw "bfsw-wdi-simple.exe not found in $($setup.Name)" }
          $list | Select-String -SimpleMatch 'drivers'
      - name: Elevated WinUSB install mode of the built app exe
        # Runs the real release exe the way the app relaunches itself via UAC
        # (runners are already elevated): main() must dispatch before Tauri starts,
        # find drivers/bfsw-wdi-simple.exe next to the exe, create/verify/clean the
        # admin-only %ProgramData% folder (no devices -> exit 0) and reject bad args.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path src-tauri/target/release/betaflight-setup-wizard.exe
          function Invoke-Mode([string[]]$a) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -WindowStyle Hidden
            $p.ExitCode
          }
          $code = Invoke-Mode @('--bfsw-elevated-winusb-install')
          if ($code -ne 0) { throw "no-device run exited $code (expected 0)" }
          $code = Invoke-Mode @('--bfsw-elevated-winusb-install', 'not-a-device')
          if ($code -ne 1008) { throw "bad-args run exited $code (expected 1008)" }
          $left = @(Get-ChildItem -Force -Directory $env:ProgramData -Filter 'BFSW-WinUSB-*')
          if ($left.Count -ne 0) { throw "work folder left behind: $($left.Name -join ', ')" }
          Write-Host 'elevated mode OK'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux-check:
    # The ubuntu-latest leg keeps the check name `linux-check`. ubuntu-26.04 is an
    # optional, non-blocking preview of the image ubuntu-latest is moving to
    # (rollout Oct 19 - Nov 19, 2026).
    name: ${{ matrix.optional && format('linux-check ({0}, optional)', matrix.os) || 'linux-check' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optional: false
          - os: ubuntu-26.04
            optional: true
    # Normally 2-6 min. Bounds a stuck job instead of the 6 h default.
    timeout-minutes: 25
    env:
      APT_TEST_BREAK_FIRST_MIRROR: ${{ inputs.apt_fallback_test && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      # The .debs are cached per OS release + runner image + package list. A slow Azure
      # apt mirror (~70 kB/s for 72.8 MB) stalled this job for 17-25 min several times.
      - name: apt cache key
        id: apt-key
        run: |
          . /etc/os-release
          echo "key=apt-${ID}${VERSION_ID}-${ImageOS}-${ImageVersion}-${{ hashFiles('.github/linux-deps.txt') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-${ID}${VERSION_ID}-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "dir=${RUNNER_TEMP}/apt-archives" >> "$GITHUB_OUTPUT"
      - name: Restore apt package cache
        id: apt-cache
        if: ${{ !inputs.apt_fallback_test }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      # Script budget is 450 s (update <= 45 s and download <= 240 s per attempt,
      # 75 s kept for dpkg), inside this 8 min limit.
      - name: Install Tauri system deps
        timeout-minutes: 8
        run: .github/scripts/apt-install.sh .github/linux-deps.txt "${{ steps.apt-key.outputs.dir }}"
      - name: Save apt package cache
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' && !inputs.apt_fallback_test }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate caches per image: 26.04 builds link against a newer glibc/webkit.
          key: ${{ matrix.os }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: cargo fmt / check / test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
