name: build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo and upload artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action versions: every JavaScript action here runs on Node 24 (checkout@v7,
# setup-node@v7, upload-artifact@v7, Swatinem/rust-cache@v2 >= 2.8; the local
# build-wdi-simple action uses actions/cache@v6 and microsoft/setup-msbuild@v3).
# dtolnay/rust-toolchain is a composite action (no Node runtime).
# Note: `node-version: 22` below is the app's build toolchain, not the action runtime.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build WinUSB helper (libwdi, cached)
        uses: ./.github/actions/build-wdi-simple
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: tauri build (NSIS + MSI)
        run: npm run tauri build
      - name: Check WinUSB helper is inside the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $list = 7z l $setup.FullName
          if (-not ($list | Select-String -SimpleMatch 'bfsw-wdi-simple.exe')) { throw "bfsw-wdi-simple.exe not found in $($setup.Name)" }
          $list | Select-String -SimpleMatch 'drivers'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux-check:
    runs-on: ubuntu-latest
    # Normally 2-6 min. Bounds a stuck job instead of the 6 h default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The .debs are cached per runner image + package list. A slow Azure apt mirror
      # (~70 kB/s for 72.8 MB) stalled this job for 17-25 min several times.
      - name: apt cache key
        id: apt-key
        run: |
          echo "key=apt-${ImageOS}-${ImageVersion}-${{ hashFiles('.github/linux-deps.txt') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "dir=${RUNNER_TEMP}/apt-archives" >> "$GITHUB_OUTPUT"
      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      - name: Install Tauri system deps
        timeout-minutes: 8
        run: .github/scripts/apt-install.sh .github/linux-deps.txt "${{ steps.apt-key.outputs.dir }}"
      - name: Save apt package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.apt-key.outputs.dir }}
          key: ${{ steps.apt-key.outputs.key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: cargo fmt / check / test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
