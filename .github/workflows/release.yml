name: release

# Tag vX.Y.Z or vX.Y.Z-N (matching src-tauri/tauri.conf.json "version"; see
# .github/scripts/check-release-version.mjs for the MSI version rules) -> build NSIS + MSI on
# windows-latest -> DRAFT GitHub release with installers, SHA256SUMS.txt and the
# libwdi Corresponding Source (LGPL-3.0, see docs/PACKAGING.md). A maintainer
# reviews and publishes the draft by hand; nothing here publishes.
#
# Pull requests that touch this file, and manual runs, only do the build job
# (dry run, artifacts uploaded) - no release is created.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/actions/build-wdi-simple/**
      - .github/scripts/check-release-version.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with .github/actions/build-wdi-simple inputs and
  # src-tauri/drivers/LIBWDI-NOTICE.txt.
  LIBWDI_REF: v1.5.1
  LIBWDI_COMMIT: 9b23b82a2dd1cbffc16d46c212f92c6bf8c0c602

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # Version sources in sync, MSI-compatible (X.Y.Z or X.Y.Z-N, N <= 65535) and,
      # on a tag, tag == "v" + version.
      - name: Check app version (and tag)
        id: version
        run: node .github/scripts/check-release-version.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build WinUSB helper (libwdi, cached)
        uses: ./.github/actions/build-wdi-simple
        with:
          libwdi-ref: ${{ env.LIBWDI_REF }}
          libwdi-commit: ${{ env.LIBWDI_COMMIT }}
      # TODO(code signing, phase 3): sign src-tauri/drivers/bfsw-wdi-simple.exe here
      # (it is the exe the UAC prompt shows), e.g. with Azure Trusted Signing.
      - run: npm ci
      - run: npm test
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      # TODO(code signing, phase 3): set bundle.windows.signCommand (or
      # certificateThumbprint) in tauri.conf.json, fed by repo secrets, so Tauri signs
      # the app exe, the NSIS installer and the MSI. Unsigned builds trigger
      # SmartScreen "unknown publisher" warnings.
      # Updater artifacts (bundle.createUpdaterArtifacts) are intentionally NOT enabled:
      # they need TAURI_SIGNING_PRIVATE_KEY, which is not configured yet.
      - name: tauri build (NSIS + MSI)
        run: npm run tauri build
      - name: Check WinUSB helper is inside the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not (7z l $setup.FullName | Select-String -SimpleMatch 'bfsw-wdi-simple.exe')) { throw "helper missing from $($setup.Name)" }
      # WiX gets X.Y.Z.N for X.Y.Z-N (Tauri's convert_version); make sure the MSI really
      # carries the version we expect so a preview never ships as a mislabelled build.
      - name: Check MSI ProductVersion
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:APP_VERSION -replace '-', '.'
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $actual = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
          Write-Host "$($msi.Name): ProductVersion $actual (app version $env:APP_VERSION)"
          if ($actual -ne $expected) { throw "MSI ProductVersion $actual, expected $expected" }
      - name: libwdi Corresponding Source (LGPL-3.0)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$LIBWDI_REF" https://github.com/pbatard/libwdi "$RUNNER_TEMP/libwdi-src"
          test "$(git -C "$RUNNER_TEMP/libwdi-src" rev-parse HEAD)" = "$LIBWDI_COMMIT"
          cp .github/actions/build-wdi-simple/action.yml "$RUNNER_TEMP/BFSW-BUILD-RECIPE.yml"
          git -C "$RUNNER_TEMP/libwdi-src" archive --format=zip --prefix="libwdi-$LIBWDI_REF/" \
            --add-file="$RUNNER_TEMP/BFSW-BUILD-RECIPE.yml" \
            -o "$GITHUB_WORKSPACE/libwdi-$LIBWDI_REF-source.zip" HEAD
      - name: Collect release files + SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi dist-release/
          mv "libwdi-$LIBWDI_REF-source.zip" dist-release/
          cd dist-release
          # GitHub turns spaces in asset names into dots; rename first so the
          # names in SHA256SUMS.txt match the downloadable assets exactly.
          shopt -s nullglob
          for f in *' '*; do mv -- "$f" "${f// /_}"; done
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist-release/*
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist-release
      - name: Create or update DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist-release
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to modify it."
              exit 1
            fi
            gh release upload "$TAG" --clobber -- *
          else
            # X.Y.Z-N versions are previews: mark them as GitHub pre-releases.
            pre=()
            if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
            cat > ../notes.md <<NOTES
          Draft created by the release workflow from \`$TAG\` ($GITHUB_SHA). Review, then publish manually.

          - Windows installers: NSIS (\`*-setup.exe\`, recommended) and MSI. **Not code-signed yet**: Windows SmartScreen may warn.
          - \`SHA256SUMS.txt\`: verify with \`sha256sum -c SHA256SUMS.txt\` or PowerShell \`Get-FileHash\`.
          - \`libwdi-*-source.zip\`: Corresponding Source of the bundled WinUSB helper (libwdi, LGPL-3.0-or-later).
          NOTES
            gh release create "$TAG" --draft "${pre[@]}" --verify-tag --title "Betaflight Setup Wizard $TAG" \
              --notes-file ../notes.md -- *
          fi
